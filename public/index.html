<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ask Gemini</h1>
        <p>Enter your question below and get an answer from the Gemini AI.</p>
        
        <form id="question-form">
            <input type="text" id="question-input" placeholder="Type your question here..." required>
            <button type="submit">Submit</button>
        </form>

        <div id="response-container">
            <h2>Answer:</h2>
            <p id="response-text">Your answer will appear here...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
